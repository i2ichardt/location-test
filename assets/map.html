<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="leaflet/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; background: #e7e2d6; }
  .leaflet-container { font-family: sans-serif; }
  .pin-icon { border-radius: 50%; border: 2px solid #1A1916; background: #F4F1EA; }
  .leaflet-control-zoom { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script>
(function () {
  var orig = L.GridLayer.prototype._getTiledPixelBounds;
  L.GridLayer.prototype._getTiledPixelBounds = function (center) {
    var bounds = orig.call(this, center);
    var pad = 512;
    if (bounds && bounds.min && bounds.max) {
      bounds.min = bounds.min.subtract(L.point(pad, pad));
      bounds.max = bounds.max.add(L.point(pad, pad));
    }
    return bounds;
  };
})();
var map = L.map('map', { zoomControl: false }).setView([39.95, -75.16], 3);
var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  keepBuffer: 6,
  updateWhenIdle: false,
  updateWhenZooming: false,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);
var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  keepBuffer: 6,
  updateWhenIdle: false,
  updateWhenZooming: false,
  attribution: 'Tiles &copy; Esri'
});
var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  keepBuffer: 6,
  updateWhenIdle: false,
  updateWhenZooming: false,
  pane: 'shadowPane'
});
function setSatellite(on) {
  if (on) {
    if (map.hasLayer(streets)) map.removeLayer(streets);
    satellite.addTo(map);
    labels.addTo(map);
  } else {
    if (map.hasLayer(satellite)) map.removeLayer(satellite);
    if (map.hasLayer(labels)) map.removeLayer(labels);
    streets.addTo(map);
  }
}
var markers = {};
var focused = false;

function metersApart(a, b) {
  var r = 6371000;
  var p1 = a.lat * Math.PI / 180;
  var p2 = b.lat * Math.PI / 180;
  var dp = (b.lat - a.lat) * Math.PI / 180;
  var dl = (b.lon - a.lon) * Math.PI / 180;
  var x = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 2 * r * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function escapeHtml(text) {
  return String(text || '').replace(/[&<>"']/g, function (c) {
    if (c === '&') return '&';
    if (c === '<') return '<';
    if (c === '>') return '>';
    if (c === '"') return '"';
    return '&#39;';
  });
}

function noSignalMark() {
  return '<svg width="22" height="16" viewBox="0 0 24 16" style="display:block">'
    + '<rect x="0" y="10" width="3" height="6" rx="1" fill="#C5C9D1"/>'
    + '<rect x="4.2" y="7" width="3" height="9" rx="1" fill="#C5C9D1"/>'
    + '<rect x="8.4" y="4" width="3" height="12" rx="1" fill="#C5C9D1"/>'
    + '<rect x="12.6" y="1" width="3" height="15" rx="1" fill="#C5C9D1"/>'
    + '<circle cx="20" cy="8" r="5.2" fill="#E23B3B"/>'
    + '<path d="M18.1 6.1 L21.9 9.9 M21.9 6.1 L18.1 9.9" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>'
    + '</svg>';
}

function pinBadges(person) {
  var html = '';
  if (person.silent) {
    html += '<div style="position:absolute;right:-12px;top:-8px">' + noSignalMark() + '</div>';
  }
  if (person.gpsOff) {
    html += '<div style="position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#1A1916;color:#fff;font-size:9px;line-height:12px;font-weight:700;border-radius:6px;padding:1px 4px;white-space:nowrap">GPS off</div>';
  }
  return html;
}

function faceHtml(person) {
  var id = escapeHtml(person.userId);
  var face;
  if (person.icon) {
    face = '<img data-id="' + id + '" src="' + person.icon + '" style="width:40px;height:40px;border-radius:20px;object-fit:cover;border:2px solid #fff;background:#F4F1EA;display:block">';
  } else {
    var letter = escapeHtml(person.letter || '?');
    var bg = person.waitImage ? 'transparent' : '#C8102E';
    var color = person.waitImage ? '#1A1916' : '#fff';
    face = '<div data-id="' + id + '" style="width:40px;height:40px;border-radius:20px;background:' + bg + ';color:' + color + ';text-align:center;line-height:36px;font-weight:700;border:2px solid #fff;box-sizing:border-box">' + letter + '</div>';
  }
  return '<div data-id="' + id + '" style="position:relative;width:40px;height:40px">' + face + pinBadges(person) + '</div>';
}

function soloIcon(person) {
  return iconFor(person);
}

function bubbleIcon(people) {
  var faces = '';
  for (var i = 0; i < people.length; i++) {
    if (i) faces += '<div style="width:6px;flex:0 0 6px"></div>';
    faces += faceHtml(people[i]);
  }
  var w = people.length * 40 + (people.length - 1) * 6 + 20;
  var h = 78;
  var html = '<div style="width:' + w + 'px;height:' + h + 'px">'
    + '<div style="display:flex;flex-direction:row;align-items:center;background:#fff;border-radius:30px;padding:8px 10px;box-shadow:0 2px 8px rgba(26,25,22,.28)">'
    + faces + '</div>'
    + '<div style="width:0;height:0;margin-left:' + Math.round(w / 2 - 8) + 'px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #fff"></div>'
    + '</div>';
  return L.divIcon({ className: '', html: html, iconSize: [w, h], iconAnchor: [Math.round(w / 2), h - 2] });
}

function clusterOf(list) {
  var clusters = [];
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (typeof p.lat !== 'number' || typeof p.lon !== 'number') continue;
    var found = -1;
    for (var c = 0; c < clusters.length; c++) {
      if (metersApart(clusters[c], p) <= 50) { found = c; break; }
    }
    if (found < 0) clusters.push({ lat: p.lat, lon: p.lon, people: [p] });
    else clusters[found].people.push(p);
  }
  return clusters;
}

function iconSig(people) {
  var parts = [];
  for (var i = 0; i < people.length; i++) {
    var p = people[i];
    parts.push((p.userId || '') + ':' + (p.icon || p.letter || '') + (p.silent ? ':s' : '') + (p.gpsOff ? ':g' : ''));
  }
  return parts.join('|');
}

function clickedId(event, fallback) {
  var t = event && event.originalEvent ? event.originalEvent.target : null;
  while (t && t.getAttribute) {
    var id = t.getAttribute('data-id');
    if (id) return id;
    t = t.parentNode;
  }
  return fallback || '';
}

function setPeople(list) {
  var clusters = clusterOf(list || []);
  var seen = {};
  var bounds = [];
  for (var i = 0; i < clusters.length; i++) {
    var cluster = clusters[i];
    var ids = [];
    for (var p = 0; p < cluster.people.length; p++) ids.push(cluster.people[p].userId);
    ids.sort();
    var key = ids.join('|');
    seen[key] = true;
    bounds.push([cluster.lat, cluster.lon]);
    var sig = iconSig(cluster.people);
    var icon = cluster.people.length > 1 ? bubbleIcon(cluster.people) : soloIcon(cluster.people[0]);
    var marker = markers[key];
    if (!marker) {
      marker = L.marker([cluster.lat, cluster.lon], { icon: icon });
      marker._sig = sig;
      (function (group) {
        marker.on('click', function (ev) {
          var id = clickedId(ev, group[0].userId);
          if (window.Android && id) Android.personClicked(id);
        });
      })(cluster.people);
      marker.addTo(map);
      markers[key] = marker;
    } else {
      marker.setLatLng([cluster.lat, cluster.lon]);
      if (marker._sig !== sig) {
        marker.setIcon(icon);
        marker._sig = sig;
      }
    }
  }
  Object.keys(markers).forEach(function (id) {
    if (!seen[id]) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }
  });
  if (!focused && bounds.length) {
    focused = true;
    if (bounds.length === 1) map.setView(bounds[0], 15);
    else map.fitBounds(bounds, { padding: [48, 48] });
  }
}
function iconFor(person) {
  var badges = pinBadges(person);
  if (person.icon && !person.silent && !person.gpsOff) {
    return L.icon({
      iconUrl: person.icon,
      iconSize: [42, 42],
      iconAnchor: [21, 42],
      className: 'pin-icon'
    });
  }
  var face;
  if (person.icon) {
    face = '<img src="' + person.icon + '" style="width:42px;height:42px;border-radius:21px;object-fit:cover;border:2px solid #1A1916;background:#F4F1EA;display:block">';
  } else if (person.waitImage) {
    face = '<div style="width:36px;height:36px;border-radius:18px;background:transparent;border:2px solid rgba(26,25,22,0.28)"></div>';
  } else {
    face = '<div style="width:36px;height:36px;border-radius:18px;background:#C8102E;color:#fff;text-align:center;line-height:36px;font-weight:700;border:2px solid #1A1916">' +
      (person.letter || '?') + '</div>';
  }
  return L.divIcon({
    className: '',
    html: '<div style="position:relative;width:42px;height:48px">' + face + badges + '</div>',
    iconSize: [42, 56],
    iconAnchor: [21, 52]
  });
}

var placeMarks = [];
function setPlaces(list) {
  placeMarks.forEach(function (m) { map.removeLayer(m); });
  placeMarks = [];
  if (!list) return;
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (typeof p.lat !== 'number' || typeof p.lon !== 'number') continue;
    var safe = escapeHtml(p.name || 'Place');
    var mark = L.marker([p.lat, p.lon], {
      interactive: false,
      keyboard: false,
      icon: L.divIcon({
        className: '',
        html: '<div style="display:inline-block;background:#F7F4EE;color:#1C1B19;border:1px solid #1A1916;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap">' + safe + '</div>',
        iconSize: [1, 1],
        iconAnchor: [0, 12]
      })
    });
    mark.addTo(map);
    placeMarks.push(mark);
  }
}

function showPerson(lat, lon) {
  focused = true;
  var z = map.getZoom();
  if (z < 15) z = 16;
  map.setView([lat, lon], z);
}
function followPerson(lat, lon, zoomIn) {
  focused = true;
  if (zoomIn && map.getZoom() < 15) map.setView([lat, lon], 16);
  else map.panTo([lat, lon], { animate: true });
}
function fitGroup() {
  var pts = [];
  Object.keys(markers).forEach(function (id) {
    var ll = markers[id].getLatLng();
    pts.push([ll.lat, ll.lng]);
  });
  if (!pts.length) return;
  focused = true;
  if (pts.length === 1) map.setView(pts[0], 15);
  else map.fitBounds(pts, { paddingTopLeft: [28, 72], paddingBottomRight: [28, 120], maxZoom: 16 });
}
</script>
</body>
</html>
