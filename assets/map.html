<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="leaflet/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; background: #e7e2d6; }
  .leaflet-container { font-family: sans-serif; }
  .pin-icon { border-radius: 50%; border: 2px solid #1A1916; background: #F4F1EA; }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script>
var map = L.map('map', { zoomControl: false }).setView([39.95, -75.16], 3);
var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);
var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
});
var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  pane: 'shadowPane'
});
function setSatellite(on) {
  if (on) {
    if (map.hasLayer(streets)) map.removeLayer(streets);
    satellite.addTo(map);
    labels.addTo(map);
  } else {
    if (map.hasLayer(satellite)) map.removeLayer(satellite);
    if (map.hasLayer(labels)) map.removeLayer(labels);
    streets.addTo(map);
  }
}
L.control.zoom({ position: 'bottomright' }).addTo(map);
var markers = {};
var focused = false;

function iconFor(person) {
  if (person.icon) {
    return L.icon({
      iconUrl: person.icon,
      iconSize: [42, 42],
      iconAnchor: [21, 21],
      className: 'pin-icon'
    });
  }
  return L.divIcon({
    className: '',
    html: '<div style="width:36px;height:36px;border-radius:18px;background:#C8102E;color:#fff;text-align:center;line-height:36px;font-weight:700;border:2px solid #1A1916">' +
      (person.letter || '?') + '</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18]
  });
}

function setPeople(list) {
  var seen = {};
  var bounds = [];
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (typeof p.lat !== 'number' || typeof p.lon !== 'number') continue;
    seen[p.userId] = true;
    bounds.push([p.lat, p.lon]);
    var marker = markers[p.userId];
    if (!marker) {
      marker = L.marker([p.lat, p.lon], { icon: iconFor(p) });
      marker.bindTooltip(p.name || 'Someone', { direction: 'top', offset: [0, -16] });
      (function (id) {
        marker.on('click', function () {
          if (window.Android) Android.personClicked(id);
        });
      })(p.userId);
      marker.addTo(map);
      markers[p.userId] = marker;
    } else {
      marker.setLatLng([p.lat, p.lon]);
      marker.setIcon(iconFor(p));
      marker.setTooltipContent(p.name || 'Someone');
    }
  }
  Object.keys(markers).forEach(function (id) {
    if (!seen[id]) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }
  });
  if (!focused && bounds.length) {
    focused = true;
    if (bounds.length === 1) map.setView(bounds[0], 15);
    else map.fitBounds(bounds, { padding: [40, 40] });
  }
}

function showPerson(lat, lon) {
  focused = true;
  map.setView([lat, lon], 16);
}
</script>
</body>
</html>
