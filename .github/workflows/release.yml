name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the phone app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            LocationTest.apk \
            --title "Family ${GITHUB_REF_NAME#v}" \
            --notes "Family 2.14. Directions uses OsmAnd for turn-by-turn navigation. If OsmAnd is not installed, the app sends you to install it."
