name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the phone app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            LocationTest.apk \
            --title "Family ${GITHUB_REF_NAME#v}" \
            --notes "Family 2.15. Directions stays in the app. It draws the driving route, speaks the turns, and follows the phone. A data connection is needed to look up the roads."
