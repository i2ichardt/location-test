name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the phone app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            LocationTest.apk \
            --title "Family ${GITHUB_REF_NAME#v}" \
            --notes "Compiled phone app. Satellite or street map is remembered. Pull the People handle and the list stays where you leave it. The list scrolls. Swipe a person card sideways to close it. Center moves the map without opening Street View."
