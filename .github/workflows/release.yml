name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the phone app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            LocationTest.apk \
            --title "Family ${GITHUB_REF_NAME#v}" \
            --notes "Family 2.12. Steadier pins, Wi-Fi and alive checks, location and connection icons, and map pins that point at the exact spot."
